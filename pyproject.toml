[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databridge"
version = "0.2.0"
description = "Консольная утилита для конвертации, валидации и трансформации табличных данных."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "lxml>=5.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
databridge = "main:cli"
